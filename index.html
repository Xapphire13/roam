<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Roam</title>
    <!-- Trunk compiles the Rust crate to wasm and injects the loader here. -->
    <link data-trunk rel="rust" data-wasm-opt="s" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #171c24;
        overflow: hidden;
      }
      #roam {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
    </style>
  </head>
  <body>
    <canvas id="roam"></canvas>
  </body>
</html>
